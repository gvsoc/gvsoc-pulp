from gvtest.testsuite import *

# Test programs of the core-v-verif CV32E40P testbench (README.md), each run on the
# cv32e40p_testbench target configured like the RTL configuration it was built for.
# A program reports its end through the virtual peripherals, and the run fails unless
# it reports a pass or exits with 0.

CONFIGS = {
    'default'               : 'cv32e40p_testbench',
    'num_mhpmcounters_29'   : 'cv32e40p_testbench:config.soc/num_mhpmcounters=29',
    'pulp_fpu'              : 'cv32e40p_testbench:config.soc/corev_pulp=true:config.soc/fpu=true',
    'pulp_cluster_fpu_zfinx': 'cv32e40p_testbench:config.soc/corev_pulp=true'
                              ':config.soc/corev_cluster=true:config.soc/fpu=true'
                              ':config.soc/zfinx=true',
}

TESTS = [
    ('hello-world'                    , 'default'               ),
    ('misalign'                       , 'default'               ),
    ('riscv_ebreak_test_0'            , 'default'               ),
    ('hpmcounter_basic_test'          , 'default'               ),
    ('mhpmcounter29_csr_access_test_1', 'num_mhpmcounters_29'   ),
    ('hello-world_pulp_fpu'           , 'pulp_fpu'              ),
    ('pulp_post_increment_load_store' , 'pulp_fpu'              ),
    ('pulp_cluster_elw_test'          , 'pulp_cluster_fpu_zfinx'),
    ('zfinx_func_cov_improve_test'    , 'pulp_cluster_fpu_zfinx'),
]


def testset_build(testset):
    testset.set_name('cv32e40p')

    cwd = testset.get_path()
    for program, config in TESTS:
        test = testset.new_test(program)
        test.add_command(Shell('run', f'mkdir -p {program}'))
        test.add_command(Shell('run', f'gvrun --target {CONFIGS[config]} --work-dir {program} '
                                      f'--param soc/binary={cwd}/{program}.elf run'))
