from gvtest.testsuite import *

def testset_build(testset):
    testset.set_name('rv64')

    cwd = testset.get_path()

    target = testset.get_target().get_name()
    if target in ['cva6', 'cva6_v2']:
        # On the cva6 boards, boot Linux on the timed cva6 core
        test = testset.new_test('linux')
        test.add_command(Shell('run', f'./launch_linux.py {target}'))
    else:
        test = testset.new_test('hello')
        test.add_command(Shell('run', f'gvrun --target rv64 --work-dir rv64 --param soc/binary={cwd}/pk --param soc/args={cwd}/hello run'))

        test = testset.new_test('linux')
        test.add_command(Shell('run', './launch_linux.py'))
