from gvtest.testsuite import *

def testset_build(testset):
    testset.set_name('pulp-open')

    cwd = testset.get_path()
    target = testset.get_target().get_name()
    test = testset.new_test('hello')
    test.add_command(Shell('run', f'gvrun --target {target} --work-dir {target} --param chip/soc/binary={cwd}/hello image flash run'))
