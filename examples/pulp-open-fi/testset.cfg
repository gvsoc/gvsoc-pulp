from gvtest.testsuite import *

def testset_build(testset):
    testset.set_name('pulp-open-fi')

    cwd = testset.get_path()

    test = testset.new_test("deterministic_fi")
    test.add_command(Shell(
        "run",
        f"python3 {cwd}/fcm.py"
    ))
    test.add_description(
        "Fault injection campaign on pulp-open: a golden run followed by "
        "three hardcoded single-bit flips, one per outcome class (MASKED, "
        "SDC, DUE). Exercises the FIC model, the device registration at "
        "reset, and ficlib's campaign manager. Requires the fic-enabled "
        "target 'pulp-open:chip/soc/fic=true' to be built and installed."
    )
