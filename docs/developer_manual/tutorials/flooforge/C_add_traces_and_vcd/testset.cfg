from gvtest.testsuite import Shell, Checker, Testset, Test

def check_output_traces(_test: Test, output: str):

    expected = 'Hello, got 0x12345678 from my comp\n'
    if output.find(expected) == -1:
        return (False, "Didn't find output string\n")

    expected = 'Received request at offset 0x0, size 0x4, is_write 0\n'
    if output.find(expected) == -1:
        return (False, "Didn't find trace message\n")

    return (True, None)

def check_output_vcd(_test: Test, output: str):

    expected = 'Hello, got 0x12345678 from my comp\n'
    if output.find(expected) == -1:
        return (False, "Didn't find output string\n")

    return (True, None)

def testset_build(testset: Testset):

    test = testset.new_test('C_add_traces')
    test.add_command(Shell('clean', f'make clean BUILDDIR={test.get_path()}'))
    test.add_command(Shell('gvsoc', f'make prepare_traces gvsoc BUILDDIR={test.get_path()}'))
    test.add_command(Shell('all', f'make all BUILDDIR={test.get_path()}'))
    test.add_command(Shell('run', f'make run runner_args=--trace=my_comp BUILDDIR={test.get_path()}'))
    test.add_command(Checker('check', check_output_traces))

    test = testset.new_test('C_add_vcd')
    test.add_command(Shell('clean', f'make clean BUILDDIR={test.get_path()}'))
    test.add_command(Shell('gvsoc', f'make prepare_vcd gvsoc BUILDDIR={test.get_path()}'))
    test.add_command(Shell('all', f'make all BUILDDIR={test.get_path()}'))
    test.add_command(Shell('run', f'make run runner_args="--vcd --event=.*" BUILDDIR={test.get_path()}'))
    test.add_command(Checker('check', check_output_vcd))
