from gvtest.testsuite import *

import re


PASS_RX = re.compile(
    r'^\[\d+\] tester PASS idma_cycles=(\d+) bytes=(\d+) events=(\d+) fc_events=(\d+)\b',
    re.MULTILINE)
FAIL_RX = re.compile(r'^\[\d+\] tester FAIL .*$', re.MULTILINE)


def _check_pass(test, output, *args, **kwargs):
    m = PASS_RX.search(output)
    if m:
        expected_events = kwargs.get('expected_events')
        fc_events = int(m.group(4))
        if expected_events is not None and fc_events != expected_events:
            return False, f'expected {expected_events} completion events, got {fc_events}'
        return True, 'tester PASS observed'
    fail = FAIL_RX.search(output)
    if fail:
        return False, fail.group(0)
    return False, 'no tester PASS / FAIL line in output'


def _add(testset, name, *, description, expected_events, expected_cycles=None, tolerance=10):
    def checker(test, output, *args, **kwargs):
        return _check_pass(test, output, expected_events=expected_events)

    t = testset.new_make_test(name, flags=f'CASE={name}',
                              checker=checker,
                              retval=0,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(description)
    ref_args = {}
    if expected_cycles is not None:
        ref_args = dict(ref=expected_cycles, tol=tolerance, ref_type='analytical')
    t.add_bench('idma_cycles',
                r'\[\d+\] tester PASS idma_cycles=(\d+)',
                f'{name}: iDMA cycles from first launch to last completion',
                **ref_args)
    return t


def testset_build(testset):
    testset.set_name('idma_v3_axi')
    testset.set_components(['ips.pulp.idma_v3.reg_dma'])

    # The DMA is configured like the Spatz cluster DMA (512-bit, 3 bursts in
    # flight, 4 KiB pages, coupled legalizer, RAW coupler). The references
    # follow the RTL rules: a launch reaches the bus 2 cycles later (request
    # FIFO, legalizer), the first response beat comes back 2 cycles after the
    # request (router, memory latency 1), a write beat follows its read beat
    # by 1 cycle (2 when the two ends are misaligned), then one beat per cycle
    # with no bubble between bursts or lines, the write response takes 2
    # cycles and DONE_ID is updated the cycle after. The tester's own register
    # accesses and DONE_ID polling add a cycle of skew.

    _add(testset, '1d_small', expected_events=1, expected_cycles=8, tolerance=2,
         description="64 B: a single beat on each side.")

    _add(testset, '1d_4k_aligned', expected_events=1, expected_cycles=72, tolerance=2,
         description="4 KiB aligned: one 64-beat burst on each side.")

    _add(testset, '1d_page_cross', expected_events=1, expected_cycles=72, tolerance=2,
         description="4 KiB with the source crossing a page after 2 KiB: the coupled "
                     "legalizer cuts both sides there, the two bursts pipeline.")

    _add(testset, 'decouple_rw', expected_events=1, expected_cycles=72, tolerance=2,
         description="Same geometry decoupled: two read bursts, one write burst.")

    _add(testset, '1d_unaligned', expected_events=1, expected_cycles=24, tolerance=2,
         description="1000 B from +5 to +17: 16 beats on each side, byte shift through "
                     "the lane buffer, the first write waits for the second read beat.")

    _add(testset, '2d_16x256', expected_events=1, expected_cycles=72, tolerance=2,
         description="2D: 16 lines of 256 B back to back, one completion for the whole "
                     "request.")

    _add(testset, '1d_32k', expected_events=1, expected_cycles=520, tolerance=3,
         description="32 KiB: eight 4 KiB bursts, three in flight, no bubble.")

    _add(testset, 'w8_1d_4k', expected_events=1, expected_cycles=520, tolerance=3,
         description="4 KiB on an 8-byte data path (el1 width): 512 beats.")

    _add(testset, 'queue_full', expected_events=5, expected_cycles=2568, tolerance=4,
         description="Five 32 KiB launches into a request FIFO of three: the fifth is "
                     "denied until a slot frees, the transfers still chain without a bubble.")

    _add(testset, 'zero_len', expected_events=2, expected_cycles=71, tolerance=2,
         description="An empty transfer behind a 4 KiB one: rejected at once, both ids "
                     "advance and two events fire.")

    _add(testset, 'lat_10', expected_events=1, expected_cycles=538, tolerance=3,
         description="32 KiB with a 10-cycle memory latency: paid once on the first beat "
                     "and once on the last response, hidden between bursts.")

    _add(testset, 'no_coupler', expected_events=1, expected_cycles=520, tolerance=3,
         description="32 KiB without the RAW coupler: same as with it when reads flow.")

    # The same transfers through the xdma offload front-end (SnitchDmaV3):
    # the tester plays the Snitch core, one instruction per cycle, and polls
    # dmstat(busy); one cycle less than the register path, whose DONE_ID
    # read lands a cycle after the completion.
    xdma_refs = {
        '1d_small': 8, '1d_4k_aligned': 71, '1d_page_cross': 71, 'decouple_rw': 71,
        '1d_unaligned': 23, '2d_16x256': 71, '1d_32k': 519, 'queue_full': 2567,
        'zero_len': 71, 'lat_10': 537, 'no_coupler': 519,
    }
    xdma_events = {'queue_full': 5, 'zero_len': 2}
    for name, cycles in xdma_refs.items():
        _add(testset, f'xdma_{name}', expected_events=xdma_events.get(name, 1),
             expected_cycles=cycles, tolerance=4 if cycles > 1000 else 3 if cycles > 100 else 2,
             description=f"{name} driven through the xdma offload front-end.")
