from gvtest.testsuite import *

# Always-taken branches: each one flushes the prefetch buffer.
# The asm block is .p2align 4 so RI5CY's prefetcher consistently
# has the next branch target ready and PCCR_IMISS stays at 0
# (without the alignment, the count flips between 0 and 128
# depending on how much code precedes the asm).
# RTL measurement (free-running mcycle): ~387 cycles / 128 ~= 3.0
# cycles/taken-branch (the +2 over 385 is the .p2align padding).
# variant -> (RTL reference cycles, absolute tolerance)
REFS = {
    'branch_taken_fastmode': (387, 15),
    'branch_taken_slowmode': (387, 15),
}

# Exact hardware-counter invariants from the CALIB_PCER line, checked as
# benches with tol=0 (exact match): with the asm block aligned PCCR_IMISS
# stays 0 (same as GVSoC's prefetch model) and 128 branches are taken.
# metric -> (PCER field, ref, tol)
PCER = {
    'pcer.imiss': ('imiss', 0, 0),
    'pcer.btaken': ('btaken', 128, 0),
}


def testset_build(testset):
    # Runs on both platforms: Ri5kyEvents charges the 2-cycle pipeline
    # bubble after every taken branch, matching the RI5CY controller's
    # PC redirect path (riscv_controller.sv:410-417). Every assertion is
    # a declared bench, so it gates the test with no custom checker.
    test = testset.new_gvrun_test('branch_taken')
    for variant, (ref, tol) in REFS.items():
        test.add_bench(f'cycles.{variant.removeprefix("branch_taken_")}',
                       rf'CALIB {variant} cycles=(\d+)',
                       f'{variant} (cycles)', ref=ref, tol=tol, ref_type='rtl')
    for metric, (field, ref, tol) in PCER.items():
        test.add_bench(metric,
                       rf'CALIB_PCER branch_taken .*\b{field}=(\d+)',
                       f'branch_taken {field}', ref=ref, tol=tol,
                       ref_type='rtl')
