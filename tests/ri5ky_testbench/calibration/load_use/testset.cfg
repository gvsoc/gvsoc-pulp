from gvtest.testsuite import *

# Each (lw, addi-on-result) pair retires in 3 cycles: load + 1-cycle
# scoreboard bubble + dependent addi.
# RTL measurement: 384 cycles / 128 pairs → 3.0 cycles/pair.
# variant -> (RTL reference cycles, absolute tolerance)
REFS = {
    'load_use_fastmode': (3 * 128, 10),
    'load_use_slowmode': (3 * 128, 10),
}

# PCER cross-check: each pair has one load-use hazard, RTL fires
# PCCR_LD_STALL once per hazard (one cycle of id_valid_q).
# metric -> (PCER field, ref, tol)
PCER = {
    'pcer.ld_stall': ('ld_stall', 128, 0),
}


def testset_build(testset):
    test = testset.new_gvrun_test('load_use')
    for variant, (ref, tol) in REFS.items():
        test.add_bench(f'cycles.{variant.removeprefix("load_use_")}',
                       rf'CALIB {variant} cycles=(\d+)',
                       f'{variant} (cycles)', ref=ref, tol=tol, ref_type='rtl')
    for metric, (field, ref, tol) in PCER.items():
        test.add_bench(metric,
                       rf'CALIB_PCER load_use .*\b{field}=(\d+)',
                       f'load_use {field}', ref=ref, tol=tol, ref_type='rtl')
