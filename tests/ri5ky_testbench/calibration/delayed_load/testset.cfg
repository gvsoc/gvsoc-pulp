from gvtest.testsuite import *

# Each (lw to slow mem, indep addi, dependent addi) trio costs
# ~(slow_mem_latency + 2) cycles. The 1-instr window after the load
# is absorbed by the independent addi; the dependent addi stalls
# until the response arrives.
# RTL measurement (slow_mem_latency=5): 448 cycles / 64 trios = 7.0.
# variant -> (RTL reference cycles, absolute tolerance)
REFS = {
    'delayed_load_fastmode': (7 * 64, 15),
    'delayed_load_slowmode': (7 * 64, 15),
}

# PCER cross-check: each trio's dependent addi stalls multiple cycles
# waiting for the slow-mem load, but RTL counts only the FIRST cycle of
# each hazard (gated by id_valid_q). 64 trios -> 64 events.
# metric -> (PCER field, ref, tol)
PCER = {
    'pcer.ld_stall': ('ld_stall', 64, 0),
}


def testset_build(testset):
    test = testset.new_gvrun_test('delayed_load')
    for variant, (ref, tol) in REFS.items():
        test.add_bench(f'cycles.{variant.removeprefix("delayed_load_")}',
                       rf'CALIB {variant} cycles=(\d+)',
                       f'{variant} (cycles)', ref=ref, tol=tol, ref_type='rtl')
    for metric, (field, ref, tol) in PCER.items():
        test.add_bench(metric,
                       rf'CALIB_PCER delayed_load .*\b{field}=(\d+)',
                       f'delayed_load {field}', ref=ref, tol=tol,
                       ref_type='rtl')
