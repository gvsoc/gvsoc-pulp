from gvtest.testsuite import *

# (auipc, addi t0, jalr t0) trio. The jalr's source register has
# just been written by the addi, so the RI5CY controller raises
# jr_stall_o (one cycle while the forward path drains) on top of
# the taken-jump pipeline flush. Per trio: 1 + 1 + (1 + 1 flush +
# 1 jr_stall) = 5 cycles.
#   RTL measurement: 161 cycles / 32 = 5.03 cycles/trio.
# Both modes must match: slow mode exercises the cycle-accurate exec
# path; fast mode requires event_retire_account to fire from exec_instr
# so prev_dest_reg is tracked for the jalr hazard.
# variant -> (RTL reference cycles, absolute tolerance)
REFS = {
    'jr_stall_fastmode': (161, 10),
    'jr_stall_slowmode': (161, 10),
}

# PCER cross-check. The 32 jalrs all hit jr_stall, so PCCR_in[3]
# (jr_stall) fires 32 times and PCCR_in[7] (jump) stays 0 because
# id_valid_q is 0 during the stall cycles (riscv_cs_registers.sv:1100,
# 1104; riscv_id_stage.sv:1782).
# metric -> (PCER field, ref, tol)
PCER = {
    'pcer.jr_stall': ('jr_stall', 32, 0),
    'pcer.jump': ('jump', 0, 0),
}


def testset_build(testset):
    # Runs on both platforms now that Ri5kyEvents charges the taken-jump
    # flush + jr_stall hazard the same way the RI5CY controller does.
    test = testset.new_gvrun_test('jr_stall')
    for variant, (ref, tol) in REFS.items():
        test.add_bench(f'cycles.{variant.removeprefix("jr_stall_")}',
                       rf'CALIB {variant} cycles=(\d+)',
                       f'{variant} (cycles)', ref=ref, tol=tol, ref_type='rtl')
    for metric, (field, ref, tol) in PCER.items():
        test.add_bench(metric,
                       rf'CALIB_PCER jr_stall .*\b{field}=(\d+)',
                       f'jr_stall {field}', ref=ref, tol=tol, ref_type='rtl')
