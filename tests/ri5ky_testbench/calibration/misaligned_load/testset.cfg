from gvtest.testsuite import *

# Word loads that straddle a 4-byte boundary. The RI5CY LSU (and
# iss_v2 LsuV2 since the split-access fix) issues two aligned word
# beats, each paying the underlying memory latency.
#
# Fast mem (latency=1, sync): ~256 cycles for 128 loads (2 cycles/lw).
#
# Slow mem (latency=5, SYNCHRONOUS memory_v3): each beat completes with
# IO_REQ_DONE + annotated latency, so the two beats just pay 2*L → ~1281
# for 128 loads (10 cycles/lw). This matches the RTL-validated figure
# for a serial misaligned access on both --platform gvsoc and rtl.
#
# The asynchronous region (0x5000_0000) is deliberately not exercised
# here yet — its misaligned timing is not reconciled between the GVSoC
# async model and the RTL. To be revisited (see test.c).
# variant -> (RTL reference cycles, absolute tolerance)
REFS = {
    'misaligned_load_fastmem_fastmode': (256, 15),
    'misaligned_load_fastmem_slowmode': (256, 15),
    'misaligned_load_slowmem_fastmode': (1281, 20),
    'misaligned_load_slowmem_slowmode': (1281, 20),
}

# PCER cross-check: PCCR_LD pulses once per bus access, so 128 misaligned
# lw -> 2 beats each -> 256 (exact).
# metric -> (PCER field, ref, tol)
PCER = {
    'pcer.ld': ('ld', 256, 0),
}


def testset_build(testset):
    # Now runs on both platforms. iss_v2 LsuV2 splits misaligned word
    # accesses into two sequential aligned beats, matching the RI5CY
    # LSU behaviour within a few cycles.
    test = testset.new_gvrun_test('misaligned_load')
    for variant, (ref, tol) in REFS.items():
        test.add_bench(f'cycles.{variant.removeprefix("misaligned_load_")}',
                       rf'CALIB {variant} cycles=(\d+)',
                       f'{variant} (cycles)', ref=ref, tol=tol, ref_type='rtl')
    for metric, (field, ref, tol) in PCER.items():
        test.add_bench(metric,
                       rf'CALIB_PCER misaligned_load .*\b{field}=(\d+)',
                       f'misaligned_load {field}', ref=ref, tol=tol,
                       ref_type='rtl')
