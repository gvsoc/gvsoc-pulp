from gvtest.testsuite import *

# RI5CY pipelines one independent load per cycle when the response
# arrives the next cycle and the result is not consumed immediately.
# RTL measurement: ~256 cycles / 256 loads → 1.0 cycle/load. Two
# variants: fast (PCMR off, functional exec) and slow (PCMR on,
# cycle-accurate exec); loads have no jr_stall/event_retire_account
# dependency, so both modes match the RTL.
# variant -> (RTL reference cycles, absolute tolerance)
REFS = {
    'pipelined_loads_fastmode': (256, 10),
    'pipelined_loads_slowmode': (256, 10),
}

# PCER cross-check: no dependent consumer between loads, so no load-use
# hazards fire (exact 0). Regression guard against spurious PCCR_LD_STALL
# events from the scoreboard's reason-tag plumbing.
# metric -> (PCER field, ref, tol)
PCER = {
    'pcer.ld_stall': ('ld_stall', 0, 0),
}


def testset_build(testset):
    test = testset.new_gvrun_test('pipelined_loads')
    for variant, (ref, tol) in REFS.items():
        test.add_bench(f'cycles.{variant.removeprefix("pipelined_loads_")}',
                       rf'CALIB {variant} cycles=(\d+)',
                       f'{variant} (cycles)', ref=ref, tol=tol, ref_type='rtl')
    for metric, (field, ref, tol) in PCER.items():
        test.add_bench(metric,
                       rf'CALIB_PCER pipelined_loads .*\b{field}=(\d+)',
                       f'pipelined_loads {field}', ref=ref, tol=tol,
                       ref_type='rtl')
