from gvtest.testsuite import *

import re


PASS_RX = re.compile(
    r'^\[\d+\] tester PASS idma_cycles=(\d+) bytes=(\d+) events=(\d+) fc_events=(\d+)\b',
    re.MULTILINE)
FAIL_RX = re.compile(r'^\[\d+\] tester FAIL .*$', re.MULTILINE)


def _check_pass(test, output, *args, **kwargs):
    m = PASS_RX.search(output)
    if m:
        expected_events = kwargs.get('expected_events')
        events = int(m.group(3))
        fc_events = int(m.group(4))
        if expected_events is not None and events != expected_events:
            return False, f'expected {expected_events} completion events, got {events}'
        if fc_events != events:
            return False, f'FC event count {fc_events} differs from core event count {events}'
        return True, 'tester PASS observed'
    fail = FAIL_RX.search(output)
    if fail:
        return False, fail.group(0)
    return False, 'no tester PASS / FAIL line in output'


GATED_RX = re.compile(r'Access to the DMA while its clock is gated', re.MULTILINE)


def _check_gated(test, output, *args, **kwargs):
    if GATED_RX.search(output):
        return True, 'gated access refused'
    return False, 'no refusal of the gated access in output'


def _add(testset, name, *, description, expected_events, expected_cycles=None, tolerance=10,
         checker=None, retval=0):
    if checker is None:
        def checker(test, output, *args, **kwargs):
            return _check_pass(test, output, expected_events=expected_events)

    t = testset.new_make_test(name, flags=f'CASE={name}',
                              checker=checker,
                              retval=retval,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(description)
    if retval == 0:
        ref_args = {}
        if expected_cycles is not None:
            ref_args = dict(ref=expected_cycles, tol=tolerance, ref_type='analytical')
        t.add_bench('idma_cycles',
                    r'\[\d+\] tester PASS idma_cycles=(\d+)',
                    f'{name}: cluster iDMA cycles from first launch to last completion',
                    **ref_args)
    return t


def testset_build(testset):
    testset.set_name('idma_v3_cluster')
    testset.set_components(['ips.pulp.idma_v3.cluster_dma'])

    # Cycle references follow the RTL structure: a launch reaches the bus 3
    # cycles after its grant (request FIFO, datapath wake-up, legalizer), the
    # OBI side moves one 8-byte word per cycle with the data one cycle later,
    # the AXI side one 8-byte beat per cycle behind the memory latency, a
    # write word follows its read beat by one cycle and the completion
    # follows the last write by 2 cycles. Multi-line transfers into the TCDM
    # pay the 2-deep address FIFO in front of the OBI write manager: the
    # legalizer cannot run ahead on the write side, so the next line's read
    # request waits for the previous line's last word (10 cycles per 64 B
    # line instead of 8). The tester's own register accesses and its DONE_ID
    # polling add a cycle of skew, hence the tolerances.

    _add(testset, 's1_1d_256', expected_events=1, expected_cycles=39, tolerance=2,
         description="256 B L2 -> L1 on stream 1: one 256 B AXI burst, 32 OBI words.")

    _add(testset, 's0_1d_256', expected_events=1, expected_cycles=40, tolerance=2,
         description="256 B L1 -> L2 on stream 0: 32 OBI words, one 256 B AXI burst.")

    _add(testset, 's1_1d_4k', expected_events=1, expected_cycles=519, tolerance=3,
         description="4 KiB L2 -> L1: 16 AXI bursts pipelined, TCDM-bound at 8 B/cycle.")

    _add(testset, 's0_1d_4k', expected_events=1, expected_cycles=520, tolerance=3,
         description="4 KiB L1 -> L2: 16 AXI bursts pipelined, TCDM-bound at 8 B/cycle.")

    _add(testset, 's1_unaligned', expected_events=1, expected_cycles=41, tolerance=2,
         description="253 B L2 -> L1 with the source at +3 and the destination at +5: "
                     "one extra word on each side, byte shift across the buffer.")

    _add(testset, 's0_unaligned', expected_events=1, expected_cycles=40, tolerance=2,
         description="250 B L1 -> L2 with the source at +6 and the destination at +1.")

    _add(testset, 's0_2d_16x64', expected_events=1, expected_cycles=136, tolerance=3,
         description="2D gather L1 -> L2: 16 lines of 64 B with a 256 B source stride, "
                     "one completion for the whole request.")

    _add(testset, 's1_2d_16x64', expected_events=1, expected_cycles=165, tolerance=3,
         description="2D scatter L2 -> L1: 16 lines of 64 B with a 256 B source stride; "
                     "10 cycles per line, the write address FIFO holding the next read.")

    _add(testset, 's1_l1_to_l1', expected_events=1, expected_cycles=71, tolerance=2,
         description="512 B TCDM -> TCDM on stream 1: reads on the shared read ports, "
                     "writes on the write ports.")

    _add(testset, 's1_3d', expected_events=1, expected_cycles=77, tolerance=3,
         description="3D L2 -> L1: 4 pages of 3 lines of 32 B, the page stride applied "
                     "instead of the line stride on the second-dimension wrap.")

    _add(testset, 'zero_len', expected_events=2, expected_cycles=40, tolerance=3,
         description="An empty transfer queued behind a 256 B one: rejected at once ahead "
                     "of it, advances the ids and pulses the event without bus traffic.")

    _add(testset, 'queue_full', expected_events=10, expected_cycles=5146, tolerance=6,
         description="Ten 4 KiB launches on stream 1: the first is taken at once, the "
                     "next eight fill the queue, the tenth is denied until a slot frees; "
                     "ids run 2..11; each transfer boundary costs 2 cycles of write "
                     "address FIFO.")

    _add(testset, 'both_streams', expected_events=2, expected_cycles=518, tolerance=3,
         description="2 KiB L1 -> L2 and 2 KiB L1 -> L1 together: the two reads share "
                     "the read ports round-robin, each at half rate.")

    _add(testset, 'two_ports', expected_events=1, expected_cycles=39, tolerance=2,
         description="256 B L2 -> L1 programmed through the second register port.")

    _add(testset, 'gated', expected_events=0, checker=_check_gated, retval=2,
         description="The clock gate is wired and off: the first register access is "
                     "refused with a fatal warning, where the RTL would hang the core.")

    _add(testset, 'lat_10', expected_events=1, expected_cycles=529, tolerance=3,
         description="4 KiB L2 -> L1 with a 10-cycle memory latency: the read-ahead of "
                     "8 outstanding bursts hides it.")
