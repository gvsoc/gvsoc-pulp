# Same 4x4 narrow-wide mesh as mesh_4x4_collective.yml, but with no
# `routing.collective` block at all, so collective_enable comes out False
# (see FlooNocFlex.load_from_floogen). Used only by the unicast_off
# scenario, to prove the plain unicast path is unperturbed when the
# collective feature is compiled in but switched off entirely.
#
# user_width must stay a plain int here (not the {name: width} dict form
# mesh_4x4_collective.yml uses): floogen's own Network.validate_protocols
# only runs its narrow/wide user_width-consistency check (which puts
# user_width into a Python set()) when routing.collective.en_collective is
# False, and a dict is unhashable - installed floogen crashes with
# `TypeError: unhashable type: 'dict'` on this exact yaml shape whenever
# collectives are off.
#
