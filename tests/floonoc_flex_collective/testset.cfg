from gvtest.testsuite import *


def testset_build(testset):
    testset.set_name('floonoc_flex_collective')

    # One gvtest case per COLLECTIVES.md "Test matrix" row (unicast_on/off
    # together cover that row's collective_enable=True/False comparison),
    # plus a "_wide" variant of every link-direction-sensitive row (see
    # test.cpp's itf()) - unicast_on/off stay narrow-only since they're a
    # link-agnostic regression anchor, not something link width affects.
    rows = [
        'broadcast_full_mesh', 'broadcast_subgrid',
        'reduction_add_uint16', 'reduction_add_int16', 'reduction_add_fp16',
        'reduction_max_uint16', 'reduction_max_int16', 'reduction_max_fp16',
        'barrier', 'mixed_traffic',
    ]
    for case in ['unicast_on', 'unicast_off'] + rows + [f'{row}_wide' for row in rows]:
        testset.new_make_test(case, flags=f'CASE={case}',
                              build_resource='gvsoc.core.build', no_clean=True)
